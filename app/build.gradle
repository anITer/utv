plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bjunicom.iptv'
    compileSdk 34

    defaultConfig {
        applicationId "com.bjunicom.iptv"
        minSdk 21
        targetSdk 34
        versionCode 110
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file('keystore/bj_unicom_iptv_release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'bjiptv2026'
            keyAlias System.getenv('KEY_ALIAS') ?: 'bjunicom_iptv'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'bjiptv2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        pickFirst 'lib/*/libijkffmpeg.so'
        pickFirst 'lib/*/libijksdl.so'
        pickFirst 'lib/*/libijkplayer.so'
    }
}

dependencies {
    // AndroidX & UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Bilibili ijkplayer core & patched multi-ABI native libraries (in src/main/jniLibs with MP2 decoder enabled)
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'

    // ExoPlayer 2.19.1 for UTVPlayer (custom PreloadMediaSource, ProgressiveMediaPeriod, SampleQueue, LoadControl, PlaceholderSurface)
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-extractor:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}
